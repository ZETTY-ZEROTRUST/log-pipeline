# Include in nginx http{} only after the infra owner reviews it.
# No Authorization/Cookie/query/body/JWT fields. Raw IP/UA are pseudonymized by producer.
log_format zetty_file escape=json
  '{"request_id":"$request_id","time":"$time_iso8601",'
  '"remote_addr":"$remote_addr","user_agent":"$http_user_agent",'
  '"method":"$request_method","uri":"$uri",'
  '"status":$status,"body_bytes":$body_bytes_sent}';
# access_log /var/log/nginx/zetty-file.jsonl zetty_file;
